<nav>
    <h1>Chat Application</h1>

    <div class="nav-buttons">
        <button>Profile</button>
        <button (click)="logout()">Logout</button>
    </div>
</nav>

<div class="container">

    <aside class="groups">
        <h2>Groups</h2>

        <ul>
            <li>Technology</li>
            <li>Sports</li>
            <li>Music</li>
            <li>Programming</li>
        </ul>

        <button routerLink="/groups">Create Group</button>
    </aside>

    <aside class="channels">
        <h2>Channels</h2>

        <ul>
            <li># General</li>
            <li># News</li>
            <li># Support</li>
            <li># Random</li>
        </ul>

        <button routerLink="/channels">Create Channel</button>
    </aside>

    <section class="chat-area">

        <div class="messages">

            <div class="message">
                <strong>User1:</strong> Hello everyone!
            </div>

            <div class="message">
                <strong>User2:</strong> Welcome to the channel.
            </div>

            <div class="message">
                <strong>User3:</strong> How is everyone doing?
            </div>

        </div>

        <div class="input-area">
            <input type="text" placeholder="Type a message...">
            <button>Send</button>
        </div>

    </section>

    <aside class="online-users">
        <h2>Online Users</h2>

        <ul>
            <li>🟢 User1</li>
            <li>🟢 User2</li>
            <li>🟢 User3</li>
            <li>🟢 User4</li>
        </ul>
    </aside>

</div>
